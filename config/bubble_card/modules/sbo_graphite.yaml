sbo_graphite:
  name: SBO Graphite
  version: '0.131'
  creator: Bornste
  supported:
    - button
    - horizontal-buttons-stack
    - pop-up
    - select
    - separator
    - sub-buttons
    - media-player
  description: Bubble Card styling for the SBO Graphite theme. Maps the theme tokens to Bubble Card variables and adds room card, light tile and clock card.
  code: |-
    /* BASE: theme tokens mapped to Bubble Card variables.
       --sbo-card-surface, --sbo-card-radius and --sbo-card-inner-surface are context tokens:
       a container (e.g. sbo-panel-card) sets them for its children, so a Bubble card inside
       a panel automatically becomes a tile. Without a container the card is a panel itself. */
    :host {
      --bubble-main-background-color: var(--sbo-card-surface, var(--sbo-surface-panel));
      --bubble-border-radius: var(--sbo-card-radius, var(--sbo-radius-panel));
      --bubble-secondary-background-color: var(--sbo-card-inner-surface, var(--sbo-surface-tile));
      --bubble-sub-button-background-color: var(--sbo-card-inner-surface, var(--sbo-surface-tile));
      --bubble-sub-button-border-radius: var(--sbo-radius-tile);
      --bubble-icon-background-color: transparent;
      --bubble-accent-color: var(--sbo-accent);
      --bubble-slider-background-color: var(--sbo-surface-track);
      --bubble-pop-up-main-background-color: var(--sbo-overlay);
      --bubble-pop-up-border-radius: var(--sbo-radius-panel);
      --sbo-room-padding: var(--sbo-padding-panel, 16px);
      --sbo-scene-height: 64px;
    }

    /* NO LAYOUT ANIMATIONS: the module styles and the view theme apply after the first render.
       Home Assistant animates ha-card with "all 0.3s" (corner radius) and Bubble the wrapper with
       "all 1.5s" (content slides in). Only colors keep their transitions. */
    ha-card {
      transition: background-color 0.3s ease, color 0.3s ease !important;
    }
    .bubble-wrapper {
      transition: none !important;
    }

    /* UNAVAILABLE: no transparency (poor contrast); muted text instead */
    ha-card.is-unavailable {
      opacity: 1 !important;
    }
    ha-card.is-unavailable .bubble-name {
      color: var(--sbo-text-secondary) !important;
    }

    /* ROOM CARD: panel with room name, light status, header buttons and scene tiles */
    .bubble-container.sbo-room-card {
      height: auto !important;
    }
    /* layout: name and status left, header buttons right, scene tiles below */
    .sbo-room-card .bubble-wrapper {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto !important;
      grid-template-rows: auto auto !important;
      grid-template-areas:
        "content buttons"
        "scenes scenes" !important;
    }
    /* the room card never changes its background with the entity state */
    .sbo-room-card .bubble-background {
      background: none !important;
      box-shadow: none !important;
    }
    /* more specific than Bubble's ".bubble-wrapper.fixed-top .bubble-content-container" (min-height 54px):
       the header is only as high as name and status */
    .sbo-room-card .bubble-wrapper.fixed-top .bubble-content-container {
      grid-area: content;
      align-items: flex-start !important;
      margin: var(--sbo-room-padding) 0 12px var(--sbo-room-padding) !important;
      min-height: 0 !important;
    }
    /* name and status in one line, separated by a thin line (same as the dialog header summary),
       as high as the header buttons on the right */
    .sbo-room-card .bubble-name-container {
      margin: 0 !important;
      flex-direction: row !important;
      /* name and status share one baseline; the line is centered in the button height
         (align-content needs a wrapping flex container) */
      flex-wrap: wrap;
      align-content: center;
      align-items: baseline !important;
      justify-content: flex-start !important;
      gap: 0 12px;
      min-height: 36px;
    }
    /* same title style as the panel titles (theme tokens) */
    .sbo-room-card .bubble-name {
      flex: none;
      font-size: var(--sbo-title-size, 18px);
      font-weight: var(--sbo-title-weight, 400);
      color: var(--sbo-title-color, var(--sbo-text-primary));
      line-height: 1.2;
    }
    .sbo-room-card .bubble-state {
      min-width: 0;
      padding-left: 12px;
      position: relative;
      /* 2px more room on top for the separator line (it reads too short at cap height);
         the negative margin keeps the text on the shared baseline */
      padding-top: 2px;
      margin-top: -2px;
      font-size: 13px;
      line-height: 16px;
      white-space: nowrap !important;
      opacity: 1;
      color: var(--sbo-text-secondary);
    }
    /* separator line from the title's cap height down to the shared baseline
       (13px text in a 16px line: the baseline sits 3.5px above the bottom) */
    .sbo-room-card .bubble-state::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 3.5px;
      width: 1px;
      background: var(--sbo-separator, color-mix(in srgb, var(--sbo-ink, #f3f3f4) 24%, var(--sbo-ground, #0a0a0b)));
    }
    /* empty status (e.g. all lights off): no line and no gap; Bubble shows the raw entity state
       when the state_content template renders empty, the module marks that case */
    .sbo-room-card .bubble-state:empty,
    .sbo-room-card.sbo-state-empty .bubble-state {
      display: none !important;
    }
    /* lights on: accent and weight 500, like every highlighted status (header summary, panel info_alert) */
    ha-card.is-on .sbo-room-card .bubble-state {
      color: var(--sbo-accent);
      font-weight: 500;
    }

    /* header buttons (light off, settings) */
    .sbo-room-card .bubble-sub-button-container {
      grid-area: buttons;
      position: relative !important;
      right: auto !important;
      width: auto !important;
      /* aligned to the top: same distance to the top and the right edge */
      align-self: start;
      margin: var(--sbo-room-padding) var(--sbo-room-padding) 0 12px !important;
      gap: var(--sbo-gap-tile, 8px);
    }
    .sbo-room-card .bubble-sub-button-container .bubble-sub-button {
      --mdc-icon-size: 18px;
      width: 44px !important;
      min-width: 44px !important;
      height: 36px !important;
      border-radius: var(--sbo-radius-tile) !important;
      background: var(--sbo-card-inner-surface, var(--sbo-surface-tile)) !important;
      color: var(--sbo-text-secondary);
      box-shadow: none !important;
    }
    .sbo-room-card .bubble-sub-button-container .bubble-sub-button.bubble-sub-button-selected {
      background: var(--sbo-accent) !important;
      color: var(--sbo-accent-ink);
    }

    /* scene tiles (bottom sub-buttons) */
    .sbo-room-card .bubble-sub-button-bottom-container {
      grid-area: scenes;
      position: static !important;
      width: auto !important;
      margin: 0 var(--sbo-room-padding) var(--sbo-room-padding) var(--sbo-room-padding) !important;
    }
    /* scene tiles in a fixed grid (default 4 columns), so tiles keep the same width in every room */
    .sbo-room-card .bubble-sub-button-bottom-container .bubble-sub-button-group {
      display: grid !important;
      grid-template-columns: repeat(var(--sbo-scene-columns, 4), minmax(0, 1fr));
      gap: var(--sbo-gap-tile, 8px);
      width: 100%;
    }
    .sbo-room-card .bubble-sub-button-bottom-container .bubble-sub-button-group .bubble-sub-button {
      width: auto !important;
      min-width: 0 !important;
      flex: none !important;
    }
    .bubble-sub-button.sbo-scene-tile {
      position: relative;
      overflow: hidden;
      height: var(--sbo-scene-height) !important;
      padding: 0 12px 9px 12px !important;
      justify-content: flex-start !important;
      align-items: flex-end !important;
      border-radius: var(--sbo-radius-tile) !important;
      background: var(--sbo-card-inner-surface, var(--sbo-surface-tile)) !important;
      box-shadow: none !important;
      color: var(--sbo-text-primary);
    }
    /* color stripe: shows the scene's colors on inactive tiles */
    .bubble-sub-button.sbo-scene-tile::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 10px;
      width: 28px;
      height: 4px;
      border-radius: 2px;
      background: var(--sbo-gradient);
      z-index: 1;
    }
    .bubble-sub-button.sbo-scene-tile .bubble-sub-button-name-container {
      position: relative;
      z-index: 1;
      margin: 0 auto 0 0 !important;
      justify-content: flex-start;
      text-align: left;
      font-size: 13px;
      font-weight: 400;
    }
    .bubble-sub-button.sbo-scene-tile.bubble-sub-button-selected .bubble-sub-button-name-container {
      font-weight: 500;
    }
    /* scene icon as watermark */
    .bubble-sub-button.sbo-scene-tile .bubble-sub-button-icon {
      position: absolute;
      right: 6px;
      bottom: 3px;
      margin: 0 !important;
      --mdc-icon-size: 34px;
      color: var(--sbo-text-primary);
      opacity: 0.16;
      pointer-events: none;
      z-index: 0;
    }
    .bubble-sub-button.sbo-scene-tile.bubble-sub-button-selected {
      background: var(--sbo-gradient) !important;
      color: var(--sbo-scene-ink);
    }
    .bubble-sub-button.sbo-scene-tile.bubble-sub-button-selected::before {
      background: color-mix(in srgb, var(--sbo-scene-ink) 60%, transparent);
    }
    .bubble-sub-button.sbo-scene-tile.bubble-sub-button-selected .bubble-sub-button-icon {
      color: var(--sbo-scene-ink);
      opacity: 0.3;
    }

    /* POP-UP (dialog): darker than the panels inside, so the levels read ground → panel → tile */
    .bubble-pop-up.popup-style-classic > .bubble-header-container {
      padding: 0 16px 8px 16px !important;
    }
    .bubble-pop-up.popup-style-classic .bubble-header .bubble-content-container {
      margin-left: 0 !important;
    }
    .bubble-pop-up.popup-style-classic .bubble-header .name-without-icon {
      margin-left: 0 !important;
    }
    .bubble-pop-up.popup-style-classic .bubble-header .bubble-name {
      font-size: var(--sbo-title-size, 18px) !important;
      font-weight: var(--sbo-title-weight, 400) !important;
      color: var(--sbo-title-color, var(--sbo-text-primary));
    }
    .bubble-pop-up .bubble-close-button,
    .bubble-pop-up .bubble-previous-button {
      background: var(--sbo-surface-tile) !important;
      color: var(--sbo-text-secondary);
    }
    .bubble-pop-up.popup-style-classic .bubble-pop-up-container {
      padding: 24px 16px 16px 16px !important;
    }

    /* POP-UP header (bubble style): like the room card header – title and light status left,
       header buttons (e.g. light off) right, close button as a tile.
       Bubble pulls the content up below the header (negative margin), here it simply follows. */
    /* no gap between header and content: the content padding alone sets the distance,
       so the first panel sits as far below the header buttons as they sit below the dialog edge */
    .bubble-pop-up:not(.popup-style-classic) {
      row-gap: 0 !important;
    }
    .bubble-pop-up:not(.popup-style-classic) > .bubble-header-container {
      padding: 16px 16px 0 16px !important;
      height: auto !important;
      min-height: 0 !important;
      gap: var(--sbo-gap-tile, 8px);
      align-items: flex-start;
    }
    /* the header card is only as high as title and status; Bubble's rounded, clipped
       button container would cut off the first letter of the title */
    .bubble-pop-up:not(.popup-style-classic) .bubble-header,
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-button-card-container {
      margin: 0 !important;
      height: auto !important;
      min-height: 0 !important;
      border-radius: 0 !important;
      overflow: visible !important;
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-wrapper {
      position: relative !important;
      height: auto !important;
      min-height: 0 !important;
      border-radius: 0 !important;
      align-items: flex-start !important;
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-button-background,
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-button-card-container {
      background: none !important;
      opacity: 1 !important;
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-name-container {
      margin: 0 !important;
      height: auto !important;
      overflow: visible !important;
      gap: 0;
      /* as high as the header buttons, a title without status is centered to them */
      min-height: 36px;
      justify-content: center;
      /* optical inset: the title alone looks too close to the dialog edge */
      padding-left: 4px !important;
    }
    /* same title style as panels and room cards (theme tokens) */
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-name {
      font-size: var(--sbo-title-size, 18px) !important;
      font-weight: var(--sbo-title-weight, 400) !important;
      line-height: 1.15 !important;
      color: var(--sbo-title-color, var(--sbo-text-primary));
    }
    /* title and status together are as high as the header buttons (36px) */
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-state {
      font-size: 12px;
      line-height: 14px !important;
      opacity: 1;
      color: var(--sbo-text-secondary);
    }
    /* header summary (sbo_graphite.header_summary): right after the title, separated by a thin
       line like time and date of the clock; the right side of the header stays for the buttons */
    /* title and summary share one baseline; the line is centered in the header height
       (align-content needs a wrapping flex container) */
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-name-container.sbo-has-summary {
      flex-direction: row !important;
      flex-wrap: wrap;
      align-content: center;
      align-items: baseline !important;
      justify-content: flex-start !important;
      gap: 0 12px;
    }
    .bubble-pop-up .sbo-header-summary {
      flex: none;
      padding-left: 12px;
      position: relative;
      /* 2px more room on top for the separator line (it reads too short at cap height);
         the negative margin keeps the text on the shared baseline */
      padding-top: 2px;
      margin-top: -2px;
      font-size: 13px;
      line-height: 16px;
      color: var(--sbo-text-secondary);
      white-space: pre;
    }
    /* separator line from the title's cap height down to the shared baseline
       (13px text in a 16px line: the baseline sits 3.5px above the bottom) */
    .bubble-pop-up .sbo-header-summary::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 3.5px;
      width: 1px;
      background: var(--sbo-separator, color-mix(in srgb, var(--sbo-ink, #f3f3f4) 24%, var(--sbo-ground, #0a0a0b)));
    }
    .bubble-pop-up .sbo-header-summary:empty {
      display: none;
    }
    .bubble-pop-up .sbo-header-summary b {
      font-weight: 500;
    }
    /* status in accent color while a header button is selected (e.g. lights are on) */
    .bubble-pop-up:not(.popup-style-classic) .bubble-header.sbo-header-active .bubble-state {
      color: var(--sbo-accent);
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-sub-button-container {
      gap: var(--sbo-gap-tile, 8px);
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-sub-button,
    .bubble-pop-up:not(.popup-style-classic) .bubble-close-button,
    .bubble-pop-up:not(.popup-style-classic) .bubble-previous-button {
      --mdc-icon-size: 18px;
      width: 44px !important;
      min-width: 44px !important;
      height: 36px !important;
      border-radius: var(--sbo-radius-tile) !important;
      background: var(--sbo-surface-tile) !important;
      color: var(--sbo-text-secondary);
      box-shadow: none !important;
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-header .bubble-sub-button.bubble-sub-button-selected {
      background: var(--sbo-accent) !important;
      color: var(--sbo-accent-ink);
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-header-actions {
      height: auto !important;
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-close-icon {
      width: 18px;
      height: 18px;
    }
    .bubble-pop-up:not(.popup-style-classic) .bubble-pop-up-container {
      margin-top: 0 !important;
      padding: 16px !important;
    }

    /* CLOCK CARD: status pills on top, large time left and date right, no panel.
       The card background stays the (invisible) action area, e.g. for a hold action. */
    .bubble-container.sbo-clock-card {
      height: auto !important;
      background: none !important;
      /* no card radius: it would clip the first pill (top left corner) */
      border-radius: 0 !important;
      overflow: visible !important;
    }
    ha-card:has(.sbo-clock-card) {
      border-radius: 0 !important;
      overflow: visible !important;
    }
    .sbo-clock-card .bubble-wrapper {
      position: relative;
      display: grid !important;
      grid-template-areas: "pills" "clock";
      grid-template-columns: minmax(0, 1fr);
      row-gap: var(--sbo-clock-gap, 14px);
      height: auto;
      /* extra air below the time before the next panel */
      padding: 0 0 var(--sbo-clock-space-below, 12px) 0;
    }
    .sbo-clock-card .bubble-button-background {
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: none !important;
      opacity: 1 !important;
      cursor: default;
    }
    /* the empty content container would otherwise add a grid row (min height) */
    .sbo-clock-card .bubble-content-container,
    .sbo-clock-card .bubble-button-background ha-ripple,
    .sbo-clock-card .bubble-icon-container,
    .sbo-clock-card .bubble-name-container,
    .sbo-clock-card .bubble-sub-button-container {
      display: none !important;
    }
    /* status pills (bottom sub-buttons) */
    .sbo-clock-card .bubble-sub-button-bottom-container {
      grid-area: pills;
      position: relative !important;
      z-index: 1;
      width: auto !important;
      margin: 0 !important;
    }
    .sbo-clock-card .bubble-sub-button-bottom-container .bubble-sub-button-group {
      display: flex !important;
      flex-wrap: wrap;
      justify-content: flex-start !important;
      gap: 6px;
      width: 100%;
    }
    .sbo-clock-card .bubble-sub-button-bottom-container .bubble-sub-button {
      flex: none !important;
      width: auto !important;
      min-width: 0 !important;
      height: 28px !important;
      padding: 0 10px 0 8px !important;
      gap: 5px;
      border-radius: var(--sbo-radius-pill, 999px) !important;
      background: var(--sbo-surface-panel) !important;
      color: var(--sbo-text-secondary);
      box-shadow: none !important;
      --mdc-icon-size: 16px;
    }
    .sbo-clock-card .bubble-sub-button .bubble-sub-button-name-container {
      margin: 0 !important;
      font-size: 12px;
      font-weight: 500;
      color: var(--sbo-text-primary);
    }
    /* alert pill: selected via sub-button conditions */
    .sbo-clock-card .bubble-sub-button.bubble-sub-button-selected {
      background: color-mix(in srgb, var(--sbo-accent) 12%, var(--sbo-surface-panel)) !important;
      color: var(--sbo-accent);
    }
    .sbo-clock-card .bubble-sub-button.bubble-sub-button-selected .bubble-sub-button-name-container {
      color: var(--sbo-accent);
    }
    /* time and date */
    .sbo-clock {
      grid-area: clock;
      position: relative;
      z-index: 0;
      display: flex;
      /* date: last line on the baseline of the time */
      align-items: last baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
      pointer-events: none;
    }
    .sbo-clock-time {
      font-size: var(--sbo-clock-size, 76px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--sbo-text-primary);
    }
    .sbo-clock-date {
      font-size: 14px;
      line-height: 1.4;
      text-align: right;
      color: var(--sbo-text-secondary);
    }

    /* label pill (clock card, option "pill"): dimmed prefix, value in primary text, dimmed label;
       icon and Bubble's own text are replaced by the module */
    .bubble-sub-button.sbo-label-pill {
      padding: 0 13px !important;
    }
    .bubble-sub-button.sbo-label-pill :is(.bubble-sub-button-icon, .bubble-sub-button-name-container) {
      display: none !important;
    }
    .sbo-pill-text {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      /* optical correction: centered by the numbers the text reads slightly high */
      position: relative;
      top: var(--sbo-pill-text-offset, 0.5px);
    }
    .sbo-pill-text:empty {
      display: none;
    }
    .sbo-pill-value {
      font-weight: 600;
      color: var(--sbo-text-primary);
      font-variant-numeric: tabular-nums;
    }
    .sbo-pill-prefix, .sbo-pill-label {
      font-weight: 400;
      color: var(--sbo-text-secondary);
    }
    .sbo-pill-prefix sub {
      font-size: 0.75em;
      vertical-align: baseline;
      position: relative;
      top: 0.25em;
    }
    /* highlighted: the number stays white, prefix and label turn accent */
    .bubble-sub-button.sbo-label-pill.bubble-sub-button-selected :is(.sbo-pill-prefix, .sbo-pill-label) {
      color: var(--sbo-accent);
    }
    /* pickup pill: same pill without icon */
    .bubble-sub-button.sbo-pickup-pill .bubble-sub-button-icon {
      display: none !important;
    }
    .bubble-sub-button.sbo-pickup-pill {
      padding: 0 13px !important;
    }

    /* pickup pill (clock card): text comes from the module, hidden while nothing is due */
    .bubble-sub-button.sbo-pickup-hidden {
      display: none !important;
    }
    .bubble-sub-button.sbo-pickup-pill .bubble-sub-button-name-container {
      display: none !important;
    }
    /* the pill row is reversed (icon-left layout), order -1 puts the text after the icon */
    .bubble-sub-button.sbo-pickup-pill::after {
      content: attr(data-sbo-text);
      order: -1;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.1;
      white-space: nowrap;
      /* mostly lowercase text reads higher than the digits of the other pills: optical nudge */
      position: relative;
      top: 1px;
    }

    /* Code for applying configuration */
    ${(() => {
      const config = this.config?.sbo_graphite || {};

      // relative luminance of a hex color (0 = black, 1 = white), null for other formats
      const hexLuminance = (color) => {
        const hex = String(color).trim().replace('#', '');
        if (hex.length !== 6)
          return null;
        const channels = [0, 2, 4].map(start => parseInt(hex.substring(start, start + 2), 16) / 255)
          .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
        return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
      };

      // waste pickup: next collection day of a calendar entity.
      // Events come from the calendar API (shared cache, refreshed every 30 minutes);
      // until they are loaded, the start_time attribute of the entity is used.
      const pickupCache = window.sboPickupCache || (window.sboPickupCache = {});
      const pickupRefreshMs = 30 * 60 * 1000;
      const dayMs = 86400000;
      const startOfDay = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const dayFromDateString = (dateString) => {
        const parts = String(dateString).substring(0, 10).split('-').map(Number);
        return parts.length === 3 && parts.every(Number.isFinite) ? new Date(parts[0], parts[1] - 1, parts[2]) : null;
      };
      const eventDay = (eventStart) => {
        if (!eventStart)
          return null;
        if (eventStart.date)
          return dayFromDateString(eventStart.date);
        const startTime = new Date(eventStart.dateTime || eventStart);
        return isNaN(startTime.getTime()) ? null : startOfDay(startTime);
      };
      const loadPickupDays = (entityId, lookaheadDays, onLoaded) => {
        const today = startOfDay(new Date());
        const entry = pickupCache[entityId];
        const isFresh = entry && entry.day === today.getTime() && Date.now() - entry.fetchedAt < pickupRefreshMs;
        if (entry && entry.pending)
        {
          if (onLoaded && !entry.listeners.includes(onLoaded))
            entry.listeners.push(onLoaded);
        }
        else if (!isFresh && hass?.callApi)
        {
          const pendingEntry = { days: entry?.days, day: entry?.day, fetchedAt: entry?.fetchedAt || 0, pending: true, listeners: onLoaded ? [onLoaded] : [] };
          pickupCache[entityId] = pendingEntry;
          const end = new Date(today.getTime() + lookaheadDays * dayMs);
          const finish = (days) => {
            pickupCache[entityId] = { days: days, day: today.getTime(), fetchedAt: Date.now(), pending: false, listeners: [] };
            for (const listener of pendingEntry.listeners)
              listener();
          };
          hass.callApi('GET', `calendars/${entityId}?start=${encodeURIComponent(today.toISOString())}&end=${encodeURIComponent(end.toISOString())}`)
            .then(events => finish((Array.isArray(events) ? events : []).map(event => eventDay(event.start)).filter(Boolean)))
            .catch(() => finish(pendingEntry.days));
        }
        return pickupCache[entityId]?.days;
      };
      // returns { date, days } of the next collection or null; a collection of today counts
      // as done after dropAfter (HH:MM, default 12:00)
      const nextPickup = (entityId, lookaheadDays, dropAfter, onLoaded) => {
        const now = new Date();
        const today = startOfDay(now);
        const dropParts = String(dropAfter || '12:00').split(':').map(Number);
        const dropTime = new Date(today.getFullYear(), today.getMonth(), today.getDate(), dropParts[0] || 0, dropParts[1] || 0);
        let candidateDays = loadPickupDays(entityId, lookaheadDays, onLoaded);
        if (!candidateDays)
        {
          const startAttribute = hass?.states?.[entityId]?.attributes?.start_time;
          const startDay = startAttribute ? dayFromDateString(startAttribute) : null;
          candidateDays = startDay ? [startDay] : [];
        }
        let next = null;
        for (const date of candidateDays)
        {
          const days = Math.round((date.getTime() - today.getTime()) / dayMs);
          if (days < 0 || (days === 0 && now >= dropTime))
            continue;
          if (!next || days < next.days)
            next = { date: date, days: days };
        }
        return next;
      };
      const pickupName = (entityId) => {
        const attributes = hass?.states?.[entityId]?.attributes || {};
        return attributes.message || attributes.friendly_name || entityId;
      };

      const applySubbuttonConfiguration = (subbuttonConfig) => {
        // sub-buttons are numbered across main and bottom, so bottom indexes are
        // resolved relative to the bottom container (1 = first bottom sub-button)
        const subbutton = subbuttonConfig.position === 'bottom'
          ? card.querySelectorAll(`.bubble-sub-button-bottom-container .bubble-sub-button`)[subbuttonConfig.index - 1]
          : card.querySelector(`.bubble-sub-button-container .bubble-sub-button-${subbuttonConfig.index}`);
        if (!subbutton)
          return;

        // scene tile look when gradient colors are configured
        const colors = Array.isArray(subbuttonConfig.gradient_colors)
          ? subbuttonConfig.gradient_colors.map(c => String(c).trim()).filter(Boolean)
          : [];
        if (colors.length > 0)
        {
          subbutton.classList.add(`sbo-scene-tile`);
          subbutton.style.setProperty('--sbo-gradient', `linear-gradient(90deg, ${colors.join(', ')})`);
          // text on the filled tile: dark on bright gradients, white on dark ones
          const luminances = colors.map(hexLuminance).filter(l => l !== null);
          const averageLuminance = luminances.length ? luminances.reduce((a, b) => a + b, 0) / luminances.length : 0;
          subbutton.style.setProperty('--sbo-scene-ink', averageLuminance > 0.35 ? '#2a1a0c' : '#ffffff');
        }

        // pickup pill: shows the most urgent due collection ("<name> heute/morgen"),
        // further due collections only as "+n"; hidden while nothing is due
        if (Array.isArray(subbuttonConfig.pickup_entities))
        {
          const renderPill = () => {
            const dueItems = [];
            for (const [pickupIndex, pickupEntity] of subbuttonConfig.pickup_entities.entries())
            {
              // preview: first calendar due today, all others tomorrow (longest text)
              const next = subbuttonConfig.preview
                ? { days: pickupIndex === 0 ? 0 : 1 }
                : nextPickup(pickupEntity, 14, subbuttonConfig.drop_after, renderPill);
              if (next && next.days <= 1)
                dueItems.push({ name: pickupName(pickupEntity), days: next.days });
            }
            dueItems.sort((a, b) => a.days - b.days);
            let pillText = '';
            if (dueItems.length > 0)
            {
              pillText = `${dueItems[0].name} ${dueItems[0].days === 0 ? 'heute' : 'morgen'}`;
              if (dueItems.length > 1)
                pillText += ` +${dueItems.length - 1}`;
            }
            subbutton.classList.add('sbo-pickup-pill');
            subbutton.classList.toggle('sbo-pickup-hidden', dueItems.length === 0);
            subbutton.classList.toggle('bubble-sub-button-selected', dueItems.length > 0);
            subbutton.dataset.sboText = pillText;
          };
          renderPill();
          return;
        }

        // label pill: "[prefix] value [label]" from the state of the sub-button's entity
        if (subbuttonConfig.pill && typeof subbuttonConfig.pill === 'object')
        {
          const pill = subbuttonConfig.pill;
          let pillEntity = pill.entity;
          if (!pillEntity)
          {
            // bottom sub-buttons are numbered across all groups
            const bottomButtons = [];
            for (const entry of [].concat(this.config?.sub_button?.bottom || []))
              bottomButtons.push(...(Array.isArray(entry?.group) ? entry.group : [entry]));
            const mainButtons = [].concat(this.config?.sub_button?.main || []);
            pillEntity = (subbuttonConfig.position === 'bottom' ? bottomButtons : mainButtons)[subbuttonConfig.index - 1]?.entity;
          }
          const rawState = hass?.states?.[pillEntity]?.state;
          const number = Number(rawState);
          const isNumber = rawState !== undefined && rawState !== '' && !isNaN(number);
          const valueText = rawState === undefined || rawState === 'unavailable' || rawState === 'unknown'
            ? '–'
            : (isNumber ? String(Math.round(number)) : String(rawState));
          const labelText = isNumber && Math.round(number) === 1 && pill.label_one ? pill.label_one : (pill.label || '');
          subbutton.classList.add('sbo-label-pill');
          let text = subbutton.querySelector(`.sbo-pill-text`);
          if (!text)
          {
            text = document.createElement('span');
            text.className = 'sbo-pill-text';
            subbutton.appendChild(text);
          }
          const signature = [pill.prefix, valueText, pill.unit, labelText].join('|');
          if (text.dataset.sboSignature !== signature)
          {
            text.dataset.sboSignature = signature;
            text.textContent = '';
            const addPart = (className, content) => {
              if (!content)
                return;
              const part = document.createElement('span');
              part.className = className;
              part.textContent = content;
              text.appendChild(part);
            };
            // "CO2" / "CO₂" prefix: the 2 as subscript
            if (pill.prefix && (String(pill.prefix) === 'CO2' || String(pill.prefix) === 'CO₂'))
            {
              const prefix = document.createElement('span');
              prefix.className = 'sbo-pill-prefix';
              prefix.append('CO');
              const subscript = document.createElement('sub');
              subscript.textContent = '2';
              prefix.appendChild(subscript);
              text.appendChild(prefix);
            }
            else
              addPart('sbo-pill-prefix', pill.prefix);
            addPart('sbo-pill-value', pill.unit ? `${valueText} ${pill.unit}` : valueText);
            addPart('sbo-pill-label', labelText);
          }
        }

        const conditions = subbuttonConfig.conditions;
        if (!conditions)
          return;
        subbutton.classList.toggle('bubble-sub-button-selected', checkConditionsMet([].concat(conditions), hass));
      };

      // room card
      if (config.appearance?.room_card)
      {
        const container = card.querySelector(`.bubble-container`);
        if (container)
        {
          container.classList.add(`sbo-room-card`);
          // optional number of scene columns (default 4 from the CSS)
          const sceneColumns = Number(config.appearance?.scene_columns);
          if (sceneColumns > 0)
            container.style.setProperty('--sbo-scene-columns', String(Math.round(sceneColumns)));
          else
            container.style.removeProperty('--sbo-scene-columns');

          // empty status: a template that renders nothing makes Bubble fall back to the raw state
          // (e.g. "0" lights); hide the status in that case (re-checked whenever Bubble changes the text)
          const stateElement = container.querySelector(`.bubble-state`);
          const entityId = this.config?.entity;
          if (stateElement && entityId)
          {
            const markEmptyState = () => {
              const stateObj = hass.states[entityId];
              const text = stateElement.textContent.trim();
              const rawTexts = stateObj ? [String(stateObj.state), String(hass.formatEntityState?.(stateObj) ?? '')] : [];
              container.classList.toggle(`sbo-state-empty`, !text || rawTexts.includes(text));
            };
            markEmptyState();
            stateElement.sboMarkEmptyState = markEmptyState;
            if (!stateElement.sboStateObserver)
            {
              stateElement.sboStateObserver = new MutationObserver(() => stateElement.sboMarkEmptyState?.());
              stateElement.sboStateObserver.observe(stateElement, { childList: true, characterData: true, subtree: true });
            }
          }
        }
      }

      // right click (e.g. to open the inspector) must not trigger the card actions:
      // secondary mouse buttons are stopped before they reach Bubble's action handlers
      const actionContainer = card.querySelector(`.bubble-container`);
      if (actionContainer && !actionContainer.sboSecondaryGuard)
      {
        actionContainer.sboSecondaryGuard = true;
        const stopSecondary = (event) => {
          if (event.button !== undefined && event.button !== 0)
            event.stopPropagation();
        };
        for (const eventName of ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click', 'contextmenu'])
          actionContainer.addEventListener(eventName, stopSecondary, true);
      }

      // clock card: renders time and date, refreshed every 15 seconds while connected
      if (config.appearance?.clock_card)
      {
        const container = card.querySelector(`.bubble-container`);
        const wrapper = card.querySelector(`.bubble-wrapper`);
        if (container && wrapper)
        {
          container.classList.add(`sbo-clock-card`);
          let clock = wrapper.querySelector(`.sbo-clock`);
          if (!clock)
          {
            clock = document.createElement('div');
            clock.className = 'sbo-clock';
            const clockTime = document.createElement('div');
            clockTime.className = 'sbo-clock-time';
            const clockDate = document.createElement('div');
            clockDate.className = 'sbo-clock-date';
            const clockWeekday = document.createElement('div');
            const clockDay = document.createElement('div');
            clockDate.append(clockWeekday, clockDay);
            clock.append(clockTime, clockDate);
            wrapper.appendChild(clock);
          }
          const locale = hass?.locale?.language || 'de-CH';
          const updateClock = () => {
            const now = new Date();
            const clockTime = clock.querySelector(`.sbo-clock-time`);
            const dateLines = clock.querySelectorAll(`.sbo-clock-date div`);
            clockTime.textContent = now.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
            dateLines[0].textContent = now.toLocaleDateString(locale, { weekday: 'long' });
            dateLines[1].textContent = now.toLocaleDateString(locale, { day: 'numeric', month: 'long' });
          };
          updateClock();
          if (!clock.sboClockTimer)
          {
            clock.sboClockTimer = setInterval(() => {
              // stop when the card was removed from the page
              if (!clock.isConnected)
              {
                clearInterval(clock.sboClockTimer);
                return;
              }
              updateClock();
            }, 15000);
          }
        }
      }

      // sub-button configurations
      const subbuttonConfigs = config.subbuttons?.configurations;
      if (Array.isArray(subbuttonConfigs))
      {
        for (const subbuttonConfig of subbuttonConfigs)
          applySubbuttonConfiguration(subbuttonConfig);
      }

      // pop-up header: status in accent color while a header button is selected
      const popupHeader = card.querySelector(`.bubble-pop-up .bubble-header`);
      if (popupHeader)
        popupHeader.classList.toggle(`sbo-header-active`, !!popupHeader.querySelector(`.bubble-sub-button-selected`));

      // pop-up header summary (sbo_graphite.header_summary): colored counts right in the header,
      // e.g. "1 offline · 1 kritisch"; parts with 0 are left out
      const summaryParts = config.header_summary;
      const headerContainer = card.querySelector(`.bubble-pop-up > .bubble-header-container`);
      if (headerContainer && Array.isArray(summaryParts))
      {
        let summary = headerContainer.querySelector(`.sbo-header-summary`);
        if (!summary)
        {
          summary = document.createElement('div');
          summary.className = 'sbo-header-summary';
        }
        // place it right after the title (inside the name container)
        const headerTitle = headerContainer.querySelector(`.bubble-header .bubble-name`);
        if (headerTitle && summary.previousElementSibling !== headerTitle)
          headerTitle.after(summary);
        headerTitle?.parentElement?.classList.add(`sbo-has-summary`);
        const summaryColors = { accent: 'var(--sbo-accent)', success: 'var(--sbo-success)', danger: 'var(--sbo-danger)', secondary: 'var(--sbo-text-secondary)' };
        const parts = [];
        for (const part of summaryParts)
        {
          const value = Number(hass?.states?.[part.entity]?.state);
          if (!Number.isFinite(value) || value <= 0)
            continue;
          const template = value === 1 && part.text_one ? part.text_one : (part.text || '{value}');
          parts.push({ text: String(template).split('{value}').join(String(Math.round(value))), color: part.color ? (summaryColors[part.color] || part.color) : '' });
        }
        const emptyText = config.header_summary_empty || '';
        const summaryKey = JSON.stringify([parts, emptyText]);
        if (summary.dataset.key !== summaryKey)
        {
          summary.dataset.key = summaryKey;
          summary.replaceChildren();
          if (!parts.length && emptyText)
            summary.append(document.createTextNode(emptyText));
          parts.forEach((part, index) => {
            if (index > 0)
              summary.append(document.createTextNode(' · '));
            const element = document.createElement(part.color ? 'b' : 'span');
            element.textContent = part.text;
            if (part.color)
              element.style.color = part.color;
            summary.append(element);
          });
        }
      }
    })()}
  editor:
    - name: header_summary
      label: "Pop-up header summary as YAML list: entity, text ('{value} offline'), text_one, color (danger, accent, success, secondary or CSS)"
      selector:
        object: {}
    - name: header_summary_empty
      label: Header summary text when all counts are 0 (e.g. Alles in Ordnung)
      selector:
        text: {}
    - type: expandable
      name: appearance
      title: Appearance
      icon: mdi:palette
      expanded: false
      schema:
        - name: room_card
          label: Show as room card
          selector:
            boolean: {}
          default: false
        - name: clock_card
          label: Show as clock card (status pills, time, date)
          selector:
            boolean: {}
          default: false
        - name: scene_columns
          label: Scene columns in the room card (default 4)
          selector:
            number:
              min: 1
              max: 6
              step: 1
              mode: box
    - type: expandable
      name: subbuttons
      title: Sub-button configuration
      icon: mdi:shape-square-rounded-plus
      expanded: false
      schema:
        - name: configurations
          selector:
            object:
              multiple: true
              label_field: index
              fields:
                index:
                  label: Sub-Button Index
                  default: 1
                  required: true
                  selector:
                    number:
                      min: 1
                      step: 1
                      mode: box
                position:
                  label: Sub-Button position
                  default: main
                  selector:
                    select:
                      options:
                        - main
                        - bottom
                conditions:
                  label: Conditions for selecting the sub-button
                  selector:
                    condition: {}
                pill:
                  label: 'Label pill: prefix, unit, label, label_one, entity (optional)'
                  selector:
                    object: {}
                pickup_entities:
                  label: Pickup pill calendars (shown when a collection is due)
                  selector:
                    entity:
                      multiple: true
                      filter:
                        domain: calendar
                preview:
                  label: Pickup pill preview (show as due, for testing)
                  selector:
                    boolean: {}
                gradient_colors:
                  label: Gradient colors (scene tile)
                  selector:
                    text:
                      multiple: true
