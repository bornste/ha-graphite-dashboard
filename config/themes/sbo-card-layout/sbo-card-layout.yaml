SBO Card Layout:
  uix-theme: SBO Card Layout
  modes:
    dark:
      # base color definitions
      sbo-card-background: rgba(0, 0, 0, 50%)
      x-sbo-card-background: rgba(38, 36, 61, 80%)
      x-sbo-background-gradient2: "linear-gradient(60deg, #614385 10%, #516395 90%)"
      x-sbo-background-gradient3: "linear-gradient(60deg, #3b2952 10%, #354162 80%)"
      x-ORIGINAL-sbo-background-gradient: "linear-gradient(60deg, #241933 10%, #283149 80%)"
      sbo-accent-color-rgb: 91, 86, 145
      sbo-accent-color: rgb(var(--sbo-accent-color-rgb))
      sbo-navcard-background-rgb: 16, 13, 24
      sbo-navcard-background: rgb(var(--sbo-navcard-background-rgb))
      
      # calculated color definitions
      sbo-background-color1: "color-mix(in srgb, var(--sbo-accent-color) 22%, #0e000c)"
      sbo-background-color2: "color-mix(in srgb, var(--sbo-accent-color) 32%, #0e1e23)"
      sbo-background-gradient: "linear-gradient(60deg, var(--sbo-background-color1) 10%, var(--sbo-background-color2) 80%)"

      #sbo-background-active-color1: "color-mix(in srgb, var(--sbo-accent-color) 85%, #ff00cd)"
      #sbo-background-active-color2: "color-mix(in srgb, var(--sbo-accent-color) 85%, #2effff)"
      #sbo-background-active: "linear-gradient(60deg, var(--sbo-background-active-color1) 10%, var(--sbo-background-active-color2) 90%)"

      sbo-background-active-color1: "color-mix(in srgb, var(--sbo-accent-color), transparent 50%)"
      sbo-background-active-color2: "color-mix(in srgb, var(--sbo-accent-color), transparent 20%)"
      sbo-background-active: "linear-gradient(60deg, var(--sbo-background-active-color1) 10%, var(--sbo-background-active-color2) 90%)"
   

      # overrides
      ha-card-border-radius: 6px
      ha-card-border-color: rgba(225, 225, 225, 0%)
      ha-card-border-width: 0px
      lovelace-background: var(--sbo-background-gradient)
      bubble-main-background-color: var(--sbo-card-background)
      bubble-line-background-color: var(--primary-text-color)
      ha-card-background: var(--sbo-card-background)
      #ha-section-grid-row-gap: 12px
      
      #grid-card-gap: 8px
      #masonry-view-card-margin: 0px 8px 12px 8px
      #stack-card-margin: 6px 0
      #mush-spacing: 14px
      #primary-color: "#32b8dc"
      accent-color: var(--sbo-accent-color) #"#dc3263"
      #app-header-background-color: var(--card-background-color)
      #state-icon-color: "#135d71"
