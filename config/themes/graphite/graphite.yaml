# Graphite
# Token architecture (top to bottom):
#   1. Base inputs    - the only values a variant needs to change (ground, ink, accent)
#   2. Derived tokens - surfaces and text levels, mixed from ground and ink
#   3. Layout tokens  - radii, gaps, paddings, type scale, sizes
#   4. Home Assistant - Home Assistant variables mapped to the tokens
# A light or tinted variant only overrides the base inputs (see examples at the end).
Graphite: &graphite
  modes:
    dark: &graphiteDark
      # 1. base inputs
      graphite-ground: "#0a0a0b"
      graphite-ink: "#f3f3f4"
      graphite-ink-rgb: 243, 243, 244
      graphite-accent: "#f5c48a"
      graphite-accent-rgb: 245, 196, 138
      graphite-accent-ink: "#3a2410"
      graphite-danger: "#e8908a"
      # second highlight color (e.g. visitor mode), same lightness as the accent
      graphite-success: "#a8d5a2"
      graphite-success-ink: "#17331a"
      # language of the graphite-cards texts (de, en); remove to follow the Home Assistant language
      graphite-language: de

      # 2. derived tokens: three surface levels (page, panel, tile) and text levels
      graphite-surface-page: var(--graphite-ground)
      graphite-surface-panel: "color-mix(in srgb, var(--graphite-ink) 7%, var(--graphite-ground))"
      graphite-surface-tile: "color-mix(in srgb, var(--graphite-ink) 12%, var(--graphite-ground))"
      graphite-surface-tile-active: "color-mix(in srgb, var(--graphite-ink) 17%, var(--graphite-ground))"
      graphite-surface-track: "color-mix(in srgb, var(--graphite-ink) 18%, var(--graphite-ground))"
      graphite-text-primary: var(--graphite-ink)
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 62%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 40%, var(--graphite-ground))"
      graphite-divider: "color-mix(in srgb, var(--graphite-ink) 8%, transparent)"
      # separator between title and status in headers: opaque, so it looks the same on every surface
      graphite-separator: "color-mix(in srgb, var(--graphite-ink) 18%, var(--graphite-ground))"
      graphite-overlay: "color-mix(in srgb, var(--graphite-ground) 90%, transparent)"

      # 3. layout tokens
      graphite-radius-panel: 20px
      graphite-radius-tile: 12px
      graphite-radius-pill: 999px
      graphite-gap-panel: 16px
      graphite-gap-tile: 8px
      graphite-padding-panel: 16px

      # 3b. typography tokens: one title style for panels and room cards
      graphite-title-size: 18px
      graphite-title-weight: "400"
      graphite-title-color: var(--graphite-text-primary)

      # 3c. type scale (cards fall back to these values when a token is missing)
      graphite-font-value-size: 22px
      graphite-font-value-weight: "300"
      graphite-font-name-size: 15px
      graphite-font-label-size: 13px
      # names of tiles whose name is their main content (switch, button, scene, select)
      graphite-font-tile-name-size: var(--graphite-font-name-size)
      graphite-font-caption-size: 12px

      # 3d. inner spacing and sizes of tiles, rows, chips and icons
      graphite-padding-tile: 12px
      graphite-gap-header: 12px
      graphite-tile-height: 80px
      graphite-tile-height-compact: 72px
      graphite-tile-height-scene: 64px
      graphite-tile-height-media: 88px
      graphite-row-height: 60px
      graphite-chip-padding: 4px 10px
      graphite-chip-gap: 6px
      graphite-row-icon-size: 24px
      graphite-watermark-size: 34px
      graphite-watermark-inset: 9px
      # strength of the accent tint of active tiles and rows
      graphite-tint-active: 18%

      # 4. Home Assistant
      lovelace-background: var(--graphite-surface-page)
      primary-background-color: var(--graphite-surface-page)
      secondary-background-color: var(--graphite-surface-panel)
      card-background-color: var(--graphite-surface-panel)
      ha-card-background: var(--graphite-surface-panel)
      ha-card-border-radius: var(--graphite-radius-panel)
      ha-card-border-width: 0px
      ha-card-border-color: transparent
      ha-card-box-shadow: none
      primary-text-color: var(--graphite-text-primary)
      secondary-text-color: var(--graphite-text-secondary)
      disabled-text-color: var(--graphite-text-muted)
      rgb-primary-text-color: var(--graphite-ink-rgb)
      divider-color: var(--graphite-divider)
      accent-color: var(--graphite-accent)
      # text on accent surfaces (e.g. the notification badge in the sidebar)
      text-accent-color: var(--graphite-accent-ink)
      # selected sidebar entry in the accent instead of the HA blue
      sidebar-selected-icon-color: var(--graphite-accent)
      sidebar-selected-text-color: var(--graphite-accent)
      # primary color of Home Assistant (switches, buttons, links, selections) in the accent; the
      # ha-color-primary scale runs from the accent towards black (05-30) and white (50-95)
      primary-color: var(--graphite-accent)
      rgb-primary-color: var(--graphite-accent-rgb)
      dark-primary-color: "color-mix(in srgb, var(--graphite-accent) 80%, #000000)"
      light-primary-color: "color-mix(in srgb, var(--graphite-accent) 40%, #ffffff)"
      text-primary-color: var(--graphite-accent-ink)
      mdc-theme-primary: var(--graphite-accent)
      mdc-theme-on-primary: var(--graphite-accent-ink)
      ha-color-on-primary-loud: var(--graphite-accent-ink)
      ha-color-primary-05: "color-mix(in srgb, var(--graphite-accent) 10%, #000000)"
      ha-color-primary-10: "color-mix(in srgb, var(--graphite-accent) 20%, #000000)"
      ha-color-primary-20: "color-mix(in srgb, var(--graphite-accent) 32%, #000000)"
      ha-color-primary-30: "color-mix(in srgb, var(--graphite-accent) 62%, #000000)"
      ha-color-primary-40: var(--graphite-accent)
      ha-color-primary-50: "color-mix(in srgb, var(--graphite-accent) 85%, #ffffff)"
      ha-color-primary-60: "color-mix(in srgb, var(--graphite-accent) 70%, #ffffff)"
      ha-color-primary-70: "color-mix(in srgb, var(--graphite-accent) 50%, #ffffff)"
      ha-color-primary-80: "color-mix(in srgb, var(--graphite-accent) 30%, #ffffff)"
      ha-color-primary-90: "color-mix(in srgb, var(--graphite-accent) 15%, #ffffff)"
      ha-color-primary-95: "color-mix(in srgb, var(--graphite-accent) 8%, #ffffff)"
      ha-section-grid-row-gap: var(--graphite-gap-panel)
      ha-section-grid-column-gap: var(--graphite-gap-panel)
      ha-view-sections-column-gap: var(--graphite-gap-panel)
      ha-dialog-surface-background: var(--graphite-surface-panel)
      # hover and press of tiles and buttons (ha-ripple) in the tone of the theme instead of grey: the
      # ground with a quarter of ink; the accent stays reserved for active states
      ha-ripple-hover-color: "color-mix(in srgb, var(--graphite-ink) 25%, var(--graphite-ground))"
      ha-ripple-hover-opacity: "0.3"
      ha-ripple-pressed-color: "color-mix(in srgb, var(--graphite-ink) 25%, var(--graphite-ground))"
      ha-ripple-pressed-opacity: "0.4"


# Graphite Glass: Graphite on a lighter ground with a wallpaper; the outer panels are translucent with
# a blur behind (inner panels and tiles stay solid), the tiles get a fine light edge from the top left.
# Needs the wallpaper in /config/www/images/graphite/ (tools/wallpaper.py generates it).
Graphite Glass:
  modes:
    dark:
      <<: *graphiteDark
      graphite-ground: "#1d1d20"
      # grey texts mixed a bit lighter, so labels stay readable on the lighter ground
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 66%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 46%, var(--graphite-ground))"
      # wallpaper, dimmed by a layer of the ground colour: 0% = full image, 100% = only the ground
      graphite-wallpaper-dim: 50%
      lovelace-background: "linear-gradient(color-mix(in srgb, var(--graphite-ground) var(--graphite-wallpaper-dim), transparent) 0 0), center / cover no-repeat url(/local/images/graphite/graphite-glass-wallpaper.webp)"
      graphite-panel-outer-surface: "color-mix(in srgb, var(--graphite-surface-panel) 62%, transparent)"
      graphite-panel-backdrop: blur(28px)
      graphite-edge-show: '""'
      graphite-tile-edge: "radial-gradient(90% 70% at 0% 0%, color-mix(in srgb, var(--graphite-ink) 16%, transparent), transparent 60%), radial-gradient(30% 24% at 0% 100%, color-mix(in srgb, var(--graphite-ink) 5%, transparent), transparent 70%)"

# Graphite Salvia: bottle green ground, pebble text, yellow accent
Graphite Salvia:
  modes:
    dark:
      <<: *graphiteDark
      graphite-ground: "#16302A"
      graphite-ink: "#EEEDEA"
      graphite-ink-rgb: 238, 237, 234
      graphite-accent: "#FFC400"
      graphite-accent-rgb: 255, 196, 0
      graphite-accent-ink: "#2E2300"
      # grey text levels mixed for the contrast of Graphite (secondary 5:1, muted 3.5:1)
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 57%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 43%, var(--graphite-ground))"
      graphite-tint-active: 25%

# Graphite Midnight: blue black ground, warm ivory text, amber accent
Graphite Midnight:
  modes:
    dark:
      <<: *graphiteDark
      graphite-ground: "#0E1219"
      graphite-ink: "#EFE6D2"
      graphite-ink-rgb: 239, 230, 210
      graphite-accent: "#FFB000"
      graphite-accent-rgb: 255, 176, 0
      graphite-accent-ink: "#2E2000"
      # grey text levels mixed for the contrast of Graphite (secondary 5:1, muted 3.5:1)
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 55%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 42%, var(--graphite-ground))"
      graphite-tint-active: 25%

# Graphite Carbon: carbon ground, titanium text, turquoise accent
Graphite Carbon:
  modes:
    dark:
      <<: *graphiteDark
      graphite-ground: "#1B1C1F"
      graphite-ink: "#D7D9DC"
      graphite-ink-rgb: 215, 217, 220
      graphite-accent: "#5ED3C3"
      graphite-accent-rgb: 94, 211, 195
      graphite-accent-ink: "#112623"
      # grey text levels mixed for the contrast of Graphite (secondary 5:1, muted 3.5:1)
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 59%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 45%, var(--graphite-ground))"
      graphite-tint-active: 25%

# Graphite Lavender: lavender ground, indigo text, berry accent
# Light theme: from the ground inwards every level gets lighter, like the dark themes (what is closer
# is lighter): ground, panel with white mixed in, tiles almost white. Flat, without edge or shadow.
Graphite Lavender:
  modes:
    light: &lavender
      <<: *graphiteDark
      graphite-ground: "#D8D3E6"
      graphite-ink: "#2B2D5C"
      graphite-ink-rgb: 43, 45, 92
      graphite-accent: "#B4387A"
      graphite-accent-rgb: 180, 56, 122
      graphite-accent-ink: "#FFFFFF"
      graphite-danger: "#B3261E"
      graphite-success: "#2F7D3A"
      graphite-success-ink: "#FFFFFF"
      graphite-surface-panel: "color-mix(in srgb, #ffffff 40%, var(--graphite-ground))"
      graphite-surface-tile: "color-mix(in srgb, #ffffff 78%, var(--graphite-ground))"
      graphite-surface-tile-active: "color-mix(in srgb, #ffffff 92%, var(--graphite-ground))"
      graphite-surface-track: "color-mix(in srgb, var(--graphite-ink) 14%, var(--graphite-ground))"
      # grey text levels mixed for the contrast of Graphite (secondary 5:1, muted 3.5:1)
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 77%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 63%, var(--graphite-ground))"
      graphite-divider: "color-mix(in srgb, var(--graphite-ink) 10%, transparent)"
      graphite-tint-active: 25%
      # icons and values of lamps that are on: their colour mixed towards the text, so warm white reads
      graphite-lamp-text-strength: 50%
      # raised tiles, not used yet (flat): a soft shadow and a faint outline instead of the light edge
      # graphite-tile-shadow: "0 1px 2px color-mix(in srgb, var(--graphite-ink) 12%, transparent), 0 0 0 1px color-mix(in srgb, var(--graphite-ink) 5%, transparent)"
      graphite-dialog-highlight: "inset 0 1px 0 color-mix(in srgb, #ffffff 60%, transparent)"
      # dialogs: the dashboard behind is dimmed (an overlay darkens, also in a light theme) and the
      # glass of the dialog is more opaque, so it stands out light and clear; a light shadow sets it apart
      graphite-dialog-backdrop: "color-mix(in srgb, var(--graphite-ink) 32%, transparent)"
      graphite-dialog-surface: "color-mix(in srgb, var(--graphite-ground) 85%, transparent)"
      graphite-dialog-shadow: "0 16px 40px color-mix(in srgb, var(--graphite-ink) 16%, transparent), 0 2px 8px color-mix(in srgb, var(--graphite-ink) 8%, transparent)"
    # the same light colors on a device in dark mode (a theme without its mode is not applied)
    dark: *lavender

# Graphite Sand: sand ground, mocha green text, petrol accent
# Light theme: from the ground inwards every level gets lighter, like the dark themes (what is closer
# is lighter): ground, panel with white mixed in, tiles almost white. Flat, without edge or shadow.
Graphite Sand:
  modes:
    light: &sand
      <<: *graphiteDark
      graphite-ground: "#F0E5DB"
      graphite-ink: "#474329"
      graphite-ink-rgb: 71, 67, 41
      graphite-accent: "#2F7F7A"
      graphite-accent-rgb: 47, 127, 122
      graphite-accent-ink: "#FFFFFF"
      graphite-danger: "#B3261E"
      graphite-success: "#2F7D3A"
      graphite-success-ink: "#FFFFFF"
      graphite-surface-panel: "color-mix(in srgb, #ffffff 40%, var(--graphite-ground))"
      graphite-surface-tile: "color-mix(in srgb, #ffffff 78%, var(--graphite-ground))"
      graphite-surface-tile-active: "color-mix(in srgb, #ffffff 92%, var(--graphite-ground))"
      graphite-surface-track: "color-mix(in srgb, var(--graphite-ink) 14%, var(--graphite-ground))"
      # grey text levels mixed for the contrast of Graphite (secondary 5:1, muted 3.5:1)
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 81%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 67%, var(--graphite-ground))"
      graphite-divider: "color-mix(in srgb, var(--graphite-ink) 10%, transparent)"
      graphite-tint-active: 25%
      # icons and values of lamps that are on: their colour mixed towards the text, so warm white reads
      graphite-lamp-text-strength: 50%
      # raised tiles, not used yet (flat): a soft shadow and a faint outline instead of the light edge
      # graphite-tile-shadow: "0 1px 2px color-mix(in srgb, var(--graphite-ink) 12%, transparent), 0 0 0 1px color-mix(in srgb, var(--graphite-ink) 5%, transparent)"
      graphite-dialog-highlight: "inset 0 1px 0 color-mix(in srgb, #ffffff 60%, transparent)"
      # dialogs: the dashboard behind is dimmed (an overlay darkens, also in a light theme) and the
      # glass of the dialog is more opaque, so it stands out light and clear; a light shadow sets it apart
      # backdrop: the sand darkened (the olive ink would muddy it), so the page keeps its warm tone
      graphite-dialog-backdrop: "color-mix(in srgb, color-mix(in srgb, var(--graphite-ground) 35%, #000000) 40%, transparent)"
      graphite-dialog-surface: "color-mix(in srgb, var(--graphite-ground) 85%, transparent)"
      graphite-dialog-shadow: "0 16px 40px color-mix(in srgb, var(--graphite-ink) 16%, transparent), 0 2px 8px color-mix(in srgb, var(--graphite-ink) 8%, transparent)"
    # the same light colors on a device in dark mode (a theme without its mode is not applied)
    dark: *sand

# Variant examples (not active):
# tinted dark - only the ground changes, all surfaces follow:
#   graphite-ground: "#0d0b14"
# light - ground and ink swap roles, surface steps then mix towards dark:
#   graphite-ground: "#f4f4f6"
#   graphite-ink: "#141416"
#   graphite-ink-rgb: 20, 20, 22
