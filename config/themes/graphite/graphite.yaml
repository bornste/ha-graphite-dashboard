# Graphite
# Token architecture (top to bottom):
#   1. Base inputs    - the only values a variant needs to change (ground, ink, accent)
#   2. Derived tokens - surfaces and text levels, mixed from ground and ink
#   3. Layout tokens  - radii, gaps, paddings, type scale, sizes
#   4. Home Assistant - Home Assistant variables mapped to the tokens
# A light or tinted variant only overrides the base inputs (see examples at the end).
Graphite: &graphite
  modes:
    dark: &graphiteDark
      # 1. base inputs
      graphite-ground: "#0a0a0b"
      graphite-ink: "#f3f3f4"
      graphite-ink-rgb: 243, 243, 244
      graphite-accent: "#f5c48a"
      graphite-accent-ink: "#3a2410"
      graphite-danger: "#e8908a"
      # second highlight color (e.g. visitor mode), same lightness as the accent
      graphite-success: "#a8d5a2"
      graphite-success-ink: "#17331a"
      # language of the graphite-cards texts (de, en); remove to follow the Home Assistant language
      graphite-language: de

      # 2. derived tokens: three surface levels (page, panel, tile) and text levels
      graphite-surface-page: var(--graphite-ground)
      graphite-surface-panel: "color-mix(in srgb, var(--graphite-ink) 7%, var(--graphite-ground))"
      graphite-surface-tile: "color-mix(in srgb, var(--graphite-ink) 12%, var(--graphite-ground))"
      graphite-surface-tile-active: "color-mix(in srgb, var(--graphite-ink) 17%, var(--graphite-ground))"
      graphite-surface-track: "color-mix(in srgb, var(--graphite-ink) 18%, var(--graphite-ground))"
      graphite-text-primary: var(--graphite-ink)
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 62%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 40%, var(--graphite-ground))"
      graphite-divider: "color-mix(in srgb, var(--graphite-ink) 8%, transparent)"
      # separator between title and status in headers: opaque, so it looks the same on every surface
      graphite-separator: "color-mix(in srgb, var(--graphite-ink) 18%, var(--graphite-ground))"
      graphite-overlay: "color-mix(in srgb, var(--graphite-ground) 90%, transparent)"

      # 3. layout tokens
      graphite-radius-panel: 20px
      graphite-radius-tile: 12px
      graphite-radius-pill: 999px
      graphite-gap-panel: 16px
      graphite-gap-tile: 8px
      graphite-padding-panel: 16px

      # 3b. typography tokens: one title style for panels and room cards
      graphite-title-size: 18px
      graphite-title-weight: "400"
      graphite-title-color: var(--graphite-text-primary)

      # 3c. type scale (cards fall back to these values when a token is missing)
      graphite-font-value-size: 22px
      graphite-font-value-weight: "300"
      graphite-font-name-size: 15px
      graphite-font-label-size: 13px
      graphite-font-caption-size: 12px

      # 3d. inner spacing and sizes of tiles, rows, chips and icons
      graphite-padding-tile: 12px
      graphite-gap-header: 12px
      graphite-tile-height: 80px
      graphite-tile-height-compact: 72px
      graphite-tile-height-scene: 64px
      graphite-tile-height-media: 88px
      graphite-row-height: 60px
      graphite-chip-padding: 4px 10px
      graphite-chip-gap: 6px
      graphite-row-icon-size: 24px
      graphite-watermark-size: 34px
      graphite-watermark-inset: 9px
      # strength of the accent tint of active tiles and rows
      graphite-tint-active: 18%

      # 4. Home Assistant
      lovelace-background: var(--graphite-surface-page)
      primary-background-color: var(--graphite-surface-page)
      secondary-background-color: var(--graphite-surface-panel)
      card-background-color: var(--graphite-surface-panel)
      ha-card-background: var(--graphite-surface-panel)
      ha-card-border-radius: var(--graphite-radius-panel)
      ha-card-border-width: 0px
      ha-card-border-color: transparent
      ha-card-box-shadow: none
      primary-text-color: var(--graphite-text-primary)
      secondary-text-color: var(--graphite-text-secondary)
      disabled-text-color: var(--graphite-text-muted)
      rgb-primary-text-color: var(--graphite-ink-rgb)
      divider-color: var(--graphite-divider)
      accent-color: var(--graphite-accent)
      ha-section-grid-row-gap: var(--graphite-gap-panel)
      ha-section-grid-column-gap: var(--graphite-gap-panel)
      ha-view-sections-column-gap: var(--graphite-gap-panel)
      ha-dialog-surface-background: var(--graphite-surface-panel)


# Graphite Glass: Graphite on a lighter ground with a wallpaper; the outer panels are translucent with
# a blur behind (inner panels and tiles stay solid), the tiles get a fine light edge from the top left.
# Needs the wallpaper in /config/www/images/graphite/ (tools/wallpaper.py generates it).
Graphite Glass:
  modes:
    dark:
      <<: *graphiteDark
      graphite-ground: "#1d1d20"
      # grey texts mixed a bit lighter, so labels stay readable on the lighter ground
      graphite-text-secondary: "color-mix(in srgb, var(--graphite-ink) 66%, var(--graphite-ground))"
      graphite-text-muted: "color-mix(in srgb, var(--graphite-ink) 46%, var(--graphite-ground))"
      lovelace-background: "center / cover no-repeat url(/local/images/graphite/graphite-glass-wallpaper.webp)"
      graphite-panel-outer-surface: "color-mix(in srgb, var(--graphite-surface-panel) 62%, transparent)"
      graphite-panel-backdrop: blur(28px)
      graphite-edge-show: '""'
      graphite-tile-edge: "radial-gradient(90% 70% at 0% 0%, color-mix(in srgb, var(--graphite-ink) 16%, transparent), transparent 60%), radial-gradient(30% 24% at 0% 100%, color-mix(in srgb, var(--graphite-ink) 5%, transparent), transparent 70%)"

# Variant examples (not active):
# tinted dark - only the ground changes, all surfaces follow:
#   graphite-ground: "#0d0b14"
# light - ground and ink swap roles, surface steps then mix towards dark:
#   graphite-ground: "#f4f4f6"
#   graphite-ink: "#141416"
#   graphite-ink-rgb: 20, 20, 22
