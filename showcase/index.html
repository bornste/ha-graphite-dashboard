<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphite cards – showcase</title>
  <!-- Roboto in all weights the cards use (Home Assistant ships it; here it is served locally, no external requests) -->
  <link rel="stylesheet" href="fonts/roboto.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--graphite-surface-page);
      color: var(--graphite-text-primary);
      font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header.page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 24px 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 24px;
    }
    header.page h1 { font-size: 24px; font-weight: 400; margin: 0; }
    header.page p { margin: 0; color: var(--graphite-text-secondary); font-size: 14px; flex: 1 1 320px; }
    header.page label { font-size: 13px; color: var(--graphite-text-secondary); }
    header.page select {
      margin-left: 6px; font: inherit; color: var(--graphite-text-primary);
      background: var(--graphite-surface-tile); border: none; border-radius: 8px; padding: 4px 8px;
    }
    /* page: table of contents on the left, the groups of cards on the right */
    .layout {
      max-width: 1440px; margin: 0 auto; padding: 16px 24px 48px;
      display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 32px; align-items: start;
    }
    nav#toc {
      position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto;
      display: flex; flex-direction: column; gap: 2px; padding-top: 4px;
    }
    nav#toc a {
      display: block; padding: 4px 10px; border-radius: 8px; text-decoration: none;
      color: var(--graphite-text-secondary); font-size: 13px;
    }
    nav#toc a:hover { color: var(--graphite-text-primary); }
    nav#toc a.toc-group { margin-top: 12px; font-weight: 500; color: var(--graphite-text-primary); }
    nav#toc a.toc-group:first-child { margin-top: 0; }
    nav#toc a.toc-card { padding-left: 18px; }
    nav#toc a.current { color: var(--graphite-accent); }
    nav#toc a.toc-card.current { background: var(--graphite-surface-tile); }
    main { min-width: 0; }
    /* groups: a larger heading, a line above; cards inside with name, element name and documentation */
    section.group { scroll-margin-top: 16px; }
    section.group + section.group { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--graphite-divider, rgba(255, 255, 255, 0.08)); }
    section.group > h2 { font-size: 24px; font-weight: 400; margin: 0 0 4px; }
    section.group > p { margin: 0 0 8px; color: var(--graphite-text-secondary); font-size: 14px; }
    section.card-section { scroll-margin-top: 16px; }
    .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 32px 0 4px; }
    .card-head h3 { font-size: 18px; font-weight: 400; margin: 0; }
    .card-head code {
      font-size: 12px; color: var(--graphite-text-secondary); background: var(--graphite-surface-tile);
      padding: 2px 8px; border-radius: 999px;
    }
    .card-head a { font-size: 13px; color: var(--graphite-accent); margin-left: auto; }
    section.card-section > p { margin: 0 0 16px; color: var(--graphite-text-secondary); font-size: 14px; }
    section.card-section > p a { color: var(--graphite-accent); }
    .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; }
    /* wide examples take two columns of the grid (three fit from about 1450px); with a single column
       (below about 1040px) the whole width, so no extra column is added */
    .example.wide { grid-column: span 2; }
    @media (max-width: 1040px) { .example.wide { grid-column: 1 / -1; } }
    .example h4 { font-size: 13px; font-weight: 500; margin: 0 0 8px; color: var(--graphite-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
    /* narrow screens: the groups as a bar at the top that stays in view, without the card entries */
    @media (max-width: 1000px) {
      .layout { display: block; padding: 0 16px 48px; }
      nav#toc {
        top: 0; z-index: 2; max-height: none; overflow-x: auto; overflow-y: hidden; flex-direction: row; gap: 6px;
        margin: 0 -16px 8px; padding: 10px 16px; background: var(--graphite-surface-page); scrollbar-width: none;
      }
      nav#toc a.toc-card { display: none; }
      nav#toc a.toc-group { margin: 0; flex: none; font-weight: 400; color: var(--graphite-text-secondary); background: var(--graphite-surface-tile); border-radius: 999px; padding: 6px 12px; }
      nav#toc a.toc-group.current { color: var(--graphite-accent-ink); background: var(--graphite-accent); }
      section.group, section.card-section { scroll-margin-top: 64px; }
      .examples { grid-template-columns: minmax(0, 1fr); }
    }
    .example .note { font-size: 13px; color: var(--graphite-text-muted); margin: 8px 2px 0; }
    .example details { margin-top: 8px; }
    .example summary { font-size: 12px; color: var(--graphite-text-muted); cursor: pointer; }
    .example pre {
      margin: 8px 0 0; padding: 12px; border-radius: 12px; overflow: auto;
      background: var(--graphite-surface-panel); color: var(--graphite-text-secondary); font-size: 12px; line-height: 1.5;
    }
    /* theme colors as rows like the status rows: color chip, name, variable on the right */
    .swatches { display: flex; flex-direction: column; gap: 8px; }
    .swatch {
      box-sizing: border-box; height: var(--graphite-row-height, 60px); padding: 0 16px 0 12px; border-radius: var(--graphite-radius-tile, 12px);
      display: flex; align-items: center; gap: 12px; font-size: 14px;
      background: var(--graphite-surface-tile); color: var(--graphite-text-primary);
    }
    .swatch .chip {
      flex: none; width: 28px; height: 28px; border-radius: 8px;
      /* a faint outline, so a chip in the color of the row still shows */
      box-shadow: inset 0 0 0 1px var(--graphite-divider, rgba(255, 255, 255, 0.08));
    }
    .swatch .name { flex: 1 1 auto; min-width: 0; }
    .swatch code { font-size: 12px; color: var(--graphite-text-muted); text-align: right; overflow-wrap: anywhere; }
    section.group#theme-colors > .examples { margin-top: 24px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--graphite-surface-tile-active); color: var(--graphite-text-primary);
      padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.visible { opacity: 1; }
    dialog#more-info {
      width: min(420px, calc(100% - 32px)); padding: 0; border: none; border-radius: 20px;
      background: var(--graphite-surface-panel); color: var(--graphite-text-primary);
    }
    dialog#more-info::backdrop { background: var(--graphite-overlay); }
    dialog#more-info form { padding: 16px 20px 20px; }
    dialog#more-info header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    dialog#more-info h2 { margin: 0; font-size: 18px; font-weight: 400; }
    dialog#more-info button {
      width: 36px; height: 36px; border: none; border-radius: 12px; cursor: pointer;
      background: var(--graphite-surface-tile); color: var(--graphite-text-secondary); font-size: 14px;
    }
    dialog#more-info .state { margin: 16px 0 2px; font-size: 22px; font-weight: 300; }
    dialog#more-info .entity { margin: 0; font-size: 12px; color: var(--graphite-text-muted); }
    dialog#more-info dl {
      display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0 0; padding: 12px;
      border-radius: 12px; background: var(--graphite-surface-tile); font-size: 12px;
    }
    dialog#more-info dt { color: var(--graphite-text-secondary); }
    dialog#more-info dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header class="page">
    <h1>Graphite cards</h1>
    <p>Showcase of the graphite-cards library with sample data – no Home Assistant needed.
      Tap a card to switch it, hold it for details.
      Built for a personal dashboard, see the <a href="https://github.com/bornste/ha-graphite-dashboard" style="color: var(--graphite-accent)">repository</a>.</p>
    <label>Theme <select id="theme"></select></label>
    <label>Language <select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label>
  </header>
  <div class="layout">
    <nav id="toc" aria-label="Contents"></nav>
    <main id="showcase"></main>
  </div>
  <div class="toast" id="toast"></div>
  <dialog id="more-info"></dialog>
  <script type="module" src="graphite-cards.js"></script>
  <script type="module" src="showcase.js"></script>
</body>
</html>
