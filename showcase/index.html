<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphite cards – showcase</title>
  <!-- Roboto in all weights the cards use (Home Assistant ships it; here it is served locally, no external requests) -->
  <link rel="stylesheet" href="fonts/roboto.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      margin: 0;
      background: var(--graphite-surface-page);
      color: var(--graphite-text-primary);
      font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header.page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 24px 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 24px;
    }
    header.page h1 { font-size: 24px; font-weight: 400; margin: 0; }
    header.page p { margin: 0; color: var(--graphite-text-secondary); font-size: 14px; flex: 1 1 320px; }
    header.page label { font-size: 13px; color: var(--graphite-text-secondary); }
    header.page select {
      margin-left: 6px; font: inherit; color: var(--graphite-text-primary);
      background: var(--graphite-surface-tile); border: none; border-radius: 8px; padding: 4px 8px;
    }
    main { max-width: 1440px; margin: 0 auto; padding: 16px 24px 48px; }
    section.card-section h2 { font-size: 18px; font-weight: 400; margin: 32px 0 4px; }
    section.card-section > p { margin: 0 0 16px; color: var(--graphite-text-secondary); font-size: 14px; }
    section.card-section > p a { color: var(--graphite-accent); }
    .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; }
    .example h3 { font-size: 13px; font-weight: 500; margin: 0 0 8px; color: var(--graphite-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
    .example .note { font-size: 13px; color: var(--graphite-text-muted); margin: 8px 2px 0; }
    .example details { margin-top: 8px; }
    .example summary { font-size: 12px; color: var(--graphite-text-muted); cursor: pointer; }
    .example pre {
      margin: 8px 0 0; padding: 12px; border-radius: 12px; overflow: auto;
      background: var(--graphite-surface-panel); color: var(--graphite-text-secondary); font-size: 12px; line-height: 1.5;
    }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .swatch { border-radius: 12px; padding: 12px; min-height: 56px; font-size: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .swatch code { opacity: 0.8; overflow-wrap: anywhere; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--graphite-surface-tile-active); color: var(--graphite-text-primary);
      padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.visible { opacity: 1; }
    dialog#more-info {
      width: min(420px, calc(100% - 32px)); padding: 0; border: none; border-radius: 20px;
      background: var(--graphite-surface-panel); color: var(--graphite-text-primary);
    }
    dialog#more-info::backdrop { background: var(--graphite-overlay); }
    dialog#more-info form { padding: 16px 20px 20px; }
    dialog#more-info header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    dialog#more-info h2 { margin: 0; font-size: 18px; font-weight: 400; }
    dialog#more-info button {
      width: 36px; height: 36px; border: none; border-radius: 12px; cursor: pointer;
      background: var(--graphite-surface-tile); color: var(--graphite-text-secondary); font-size: 14px;
    }
    dialog#more-info .state { margin: 16px 0 2px; font-size: 22px; font-weight: 300; }
    dialog#more-info .entity { margin: 0; font-size: 12px; color: var(--graphite-text-muted); }
    dialog#more-info dl {
      display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0 0; padding: 12px;
      border-radius: 12px; background: var(--graphite-surface-tile); font-size: 12px;
    }
    dialog#more-info dt { color: var(--graphite-text-secondary); }
    dialog#more-info dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header class="page">
    <h1>Graphite cards</h1>
    <p>Showcase of the graphite-cards library with sample data – no Home Assistant needed.
      Tap a card to switch it, hold it for details.
      Built for a personal dashboard, see the <a href="https://github.com/bornste/ha-graphite-dashboard" style="color: var(--graphite-accent)">repository</a>.</p>
    <label>Language <select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label>
  </header>
  <main id="showcase"></main>
  <div class="toast" id="toast"></div>
  <dialog id="more-info"></dialog>
  <script type="module" src="graphite-cards.js"></script>
  <script type="module" src="showcase.js"></script>
</body>
</html>
